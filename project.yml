name: Winamp
options:
  bundleIdPrefix: com.custom.winamp
  xcodeVersion: "15.0"
  deploymentTarget:
    iOS: "16.4"
targets:
  TubeEQ:
    type: application
    platform: iOS
    deploymentTarget: "16.4"
    sources:
      - path: TubeEQ
    info:
      path: TubeEQ/Info.plist
      properties:
        CFBundleDisplayName: "Winamp"
        CFBundleName: "Winamp"
        CFBundleIdentifier: "com.winamp.player.pro"
        CFBundleShortVersionString: "2.5.0"
        CFBundleVersion: "14"
        UILaunchStoryboardName: LaunchScreen
        UIDeviceFamily:
          - 1
          - 2
        UIBackgroundModes:
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_NAME: Winamp
        PRODUCT_BUNDLE_IDENTIFIER: com.winamp.player.pro
        INFOPLIST_FILE: TubeEQ/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
