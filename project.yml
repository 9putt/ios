name: TubeEQ
options:
  bundleIdPrefix: com.custom.tubeeq
  xcodeVersion: "15.0"
  deploymentTarget:
    iOS: "16.4"
targets:
  TubeEQ:
    type: application
    platform: iOS
    deploymentTarget: "16.4"
    sources:
      - path: TubeEQ
    info:
      path: TubeEQ/Info.plist
      properties:
        CFBundleDisplayName: "Tube EQ Pro"
        CFBundleIdentifier: "com.custom.tubeeq.pro"
        CFBundleShortVersionString: "1.3.0"
        CFBundleVersion: "4"
        UILaunchStoryboardName: LaunchScreen
        UIDeviceFamily:
          - 1
          - 2
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_NAME: TubeEQ
        PRODUCT_BUNDLE_IDENTIFIER: com.custom.tubeeq.pro
        INFOPLIST_FILE: TubeEQ/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
