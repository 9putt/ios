name: Build Winamp IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode* | sort -V | tail -n 1)
          echo "Selected Xcode: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build Application for Device
        run: |
          xcodebuild clean build \
            -project Winamp.xcodeproj \
            -scheme TubeEQ \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="./build"

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r ./build/Release-iphoneos/Winamp.app Payload/ || cp -r ./build/Release-iphoneos/*.app Payload/
          zip -vr Winamp.ipa Payload
          cp Winamp.ipa TubeEQ.ipa
          ls -lh Winamp.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Winamp-IPA
          path: Winamp.ipa
          retention-days: 14

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v2.1 --yes || true
          git tag -d v2.1 || true
          gh release create v2.1 Winamp.ipa \
            --title "Winamp v2.1 for iOS" \
            --notes "Winamp Classic Modern for iPhone with authentic Lightning Bolt app icon, fullscreen layout with zero top gap, playlist extending down to bottom, YouTube login moved to Add Songs menu, and fixed YouTube player embed."
