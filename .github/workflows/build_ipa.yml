name: Build TubeEQ IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode* | sort -V | tail -n 1)
          echo "Selected Xcode: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build Application for Device
        run: |
          xcodebuild clean build \
            -project TubeEQ.xcodeproj \
            -scheme TubeEQ \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="./build"

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r ./build/Release-iphoneos/TubeEQ.app Payload/
          zip -vr TubeEQ.ipa Payload
          ls -lh TubeEQ.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TubeEQ-IPA
          path: TubeEQ.ipa
          retention-days: 14
